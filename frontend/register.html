<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Study Tracker</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body class="dark-theme">

    <!-- Ambient Background Blobs -->
    <div class="ambient-blob blob-purple"></div>
    <div class="ambient-blob blob-blue"></div>

    <!-- Animated SVG Background Graphics (Full Page) -->
    <div class="auth-graphics">
        <!-- Laptops -->
        <svg class="floating-svg svg-laptop-1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 14V6C4 4.89543 4.89543 4 6 4H18C19.1046 4 20 4.89543 20 6V14M4 14H20M4 14L2 18H22L20 14M8 18H16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="floating-svg svg-laptop-2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 14V6C4 4.89543 4.89543 4 6 4H18C19.1046 4 20 4.89543 20 6V14M4 14H20M4 14L2 18H22L20 14M8 18H16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Stack of Books -->
        <svg class="floating-svg svg-book-1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 19V5C4 3.89543 4.89543 3 6 3H19C19.5523 3 20 3.44772 20 4V18C20 18.5523 19.5523 19 19 19H4ZM4 19C4 20.1046 4.89543 21 6 21H19C19.5523 21 20 20.5523 20 20V19M4 19H20" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 7H15" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 11H15" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="floating-svg svg-book-2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 19V5C4 3.89543 4.89543 3 6 3H19C19.5523 3 20 3.44772 20 4V18C20 18.5523 19.5523 19 19 19H4ZM4 19C4 20.1046 4.89543 21 6 21H19C19.5523 21 20 20.5523 20 20V19M4 19H20" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 7H15" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 11H15" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Pen/Pencils -->
        <svg class="floating-svg svg-pencil-1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 3L21 7L7 21H3V17L17 3Z" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 6L18 10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="floating-svg svg-pencil-2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 3L21 7L7 21H3V17L17 3Z" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 6L18 10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- New Project Icons -->
        <!-- Clock -->
        <svg class="floating-svg svg-clock" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 6V12L16 14" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Target (Goals) -->
        <svg class="floating-svg svg-target" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Chart (Progress) -->
        <svg class="floating-svg svg-chart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 3V21H21" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 14L11 10L15 14L21 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Lightbulb (Ideas) -->
        <svg class="floating-svg svg-lightbulb" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18h6M10 21h4M12 2A7 7 0 0 0 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74A7 7 0 0 0 12 2Z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Clipboard (To-Do) -->
        <svg class="floating-svg svg-clipboard" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1Z" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 12h6M9 16h6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <div class="auth-wrapper">

        <!-- Left Side Panel -->
        <div class="auth-left">
            <div class="auth-left-content">
                <h1>🎓 Student Study Tracker</h1>
                <p>Join thousands of students who track their study progress every day.</p>
                <div class="features-list">
                    <div class="feature-item">✅ Free to use forever</div>
                    <div class="feature-item">📱 Works on all devices</div>
                    <div class="feature-item">📈 Track every subject</div>
                    <div class="feature-item">🏆 Achieve your goals</div>
                </div>
            </div>
        </div>

        <!-- Right Side Form -->
        <div class="auth-right">
            <div class="auth-box">

                <div class="auth-header">
                    <h2>Create Account 🚀</h2>
                    <p>Start your study tracking journey today</p>
                </div>

                <form id="registerForm">

                    <div class="input-group">
                        <label>👤 Full Name</label>
                        <input type="text" id="name" class="neon-input" placeholder="Enter your full name" />
                    </div>

                    <div class="input-group">
                        <label>📧 Email Address</label>
                        <input type="email" id="email" class="neon-input" placeholder="Enter your email" />
                    </div>

                    <div class="input-group">
                        <label>🔒 Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" class="neon-input" placeholder="Create a password" />
                            <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>🔒 Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" class="neon-input" placeholder="Confirm your password" />
                            <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</span>
                        </div>
                    </div>

                    <p id="errorMsg" class="error-msg"></p>

                    <button type="submit" class="btn primary-btn glow-on-hover">Create Account →</button>

                </form>

                <div class="divider"><span>or</span></div>

                <p class="link">
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
